# Edge proxy: the only public entry point of the container stack.
#
# It exists for one security property: X-Forwarded-For is *overwritten* with the real socket
# address, never appended to or passed through. The API trusts this container's fixed IP
# (VIBEGUARD_TRUSTED_PROXIES) for client identity, so a client can't spoof its way out of the
# rate limits. (Next.js's own rewrite proxy forwards a client-supplied X-Forwarded-For as-is,
# which is why browser API traffic goes straight from here to FastAPI, not through Next.)

server {
    listen 8080;
    server_tokens off;

    # Matches VIBEGUARD_MAX_REQUEST_BYTES (5MB): refuse oversized bodies at the edge
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
