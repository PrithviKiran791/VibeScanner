# Local dev stack.
#   docker compose -f docker/docker-compose.yml up -d              # PostgreSQL 16 + Redis only
#   docker compose -f docker/docker-compose.yml --profile app up --build
#       # + migrations, API, Celery worker, dashboard, and the nginx edge on http://localhost:3000
name: vibeguard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vibeguard
      POSTGRES_PASSWORD: vibeguard  # local dev only
      POSTGRES_DB: vibeguard
    ports: ["${VIBEGUARD_PG_PORT:-5432}:5432"]  # set VIBEGUARD_PG_PORT if a local Postgres owns 5432
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibeguard -d vibeguard"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["${VIBEGUARD_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ["app"]
    build: { context: ../backend, dockerfile: ../docker/backend.Dockerfile }
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      VIBEGUARD_DATABASE_URL: postgresql+psycopg://vibeguard:vibeguard@postgres:5432/vibeguard
      VIBEGUARD_REDIS_URL: redis://redis:6379/0
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-google/gemma-4-31b-it:free}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-google/gemma-4-26b-a4b-it:free}
      VIBEGUARD_GITHUB_TOKEN: ${VIBEGUARD_GITHUB_TOKEN:-}
      VIBEGUARD_GITHUB_WEBHOOK_SECRET: ${VIBEGUARD_GITHUB_WEBHOOK_SECRET:-}
      # Only the nginx edge (fixed address) may vouch for client IPs (rate limiting)
      VIBEGUARD_TRUSTED_PROXIES: '["172.28.0.10/32"]'
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: ["app"]
    build: { context: ../backend, dockerfile: ../docker/backend.Dockerfile }
    command: ["uvicorn", "vibeguard.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend-env
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/readyz').status != 200)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    profiles: ["app"]
    build: { context: ../backend, dockerfile: ../docker/backend.Dockerfile }
    command: ["celery", "-A", "vibeguard.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend-env
    # Clones live on a RAM disk and vanish with the container
    tmpfs: ["/tmp:size=512m"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  frontend:
    profiles: ["app"]
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        VIBEGUARD_API_URL: http://api:8000
    expose: ["3000"]  # reached only through the edge
    depends_on:
      api: { condition: service_healthy }

  edge:
    profiles: ["app"]
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["3000:8080"]
    networks:
      default: { ipv4_address: 172.28.0.10 }
    depends_on:
      frontend: { condition: service_healthy }
      api: { condition: service_healthy }

networks:
  default:
    ipam:
      config: [{ subnet: 172.28.0.0/16 }]

volumes:
  pgdata:
