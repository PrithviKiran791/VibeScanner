# Secret detection rules, adapted from the Gitleaks default rule set (MIT).
# `capture` names the regex group holding the secret value (used for redaction + fixes).
# `env` is the environment variable a code fix should read the value from.
# `entropy` (optional) is the minimum Shannon entropy of the captured value.

[[rules]]
id = "aws-access-key-id"
title = "Exposed AWS Access Key"
severity = "CRITICAL"
regex = '''\b(?P<secret>(?:AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16})\b'''
env = "AWS_ACCESS_KEY_ID"

[[rules]]
id = "stripe-secret-key"
title = "Exposed Stripe Secret Key"
severity = "CRITICAL"
regex = '''\b(?P<secret>(?:sk|rk)_live_[A-Za-z0-9]{20,99})\b'''
env = "STRIPE_SECRET_KEY"

[[rules]]
id = "github-token"
title = "Exposed GitHub Token"
severity = "CRITICAL"
regex = '''\b(?P<secret>(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82})\b'''
env = "GITHUB_TOKEN"

[[rules]]
id = "anthropic-api-key"
title = "Exposed Anthropic API Key"
severity = "CRITICAL"
regex = '''\b(?P<secret>sk-ant-(?:api03|admin01)-[A-Za-z0-9_-]{80,120})'''
env = "ANTHROPIC_API_KEY"

[[rules]]
id = "openai-api-key"
title = "Exposed OpenAI API Key"
severity = "CRITICAL"
regex = '''\b(?P<secret>sk-(?:proj-|svcacct-)?[A-Za-z0-9_-]{20,}T3BlbkFJ[A-Za-z0-9_-]{20,})\b'''
env = "OPENAI_API_KEY"

[[rules]]
id = "google-api-key"
title = "Exposed Google API Key"
severity = "HIGH"
regex = '''\b(?P<secret>AIza[0-9A-Za-z_-]{35})\b'''
env = "GOOGLE_API_KEY"

[[rules]]
id = "slack-token"
title = "Exposed Slack Token"
severity = "HIGH"
regex = '''\b(?P<secret>xox[baprs]-[0-9A-Za-z-]{10,72})\b'''
env = "SLACK_TOKEN"

[[rules]]
id = "private-key"
title = "Committed Private Key"
severity = "CRITICAL"
regex = '''(?P<secret>-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY(?: BLOCK)?-----)'''

[[rules]]
id = "generic-secret-assignment"
title = "Hardcoded Secret"
severity = "HIGH"
regex = '''(?i)\b[\w.-]*(?:secret|passw(?:or)?d|api[_-]?key|access[_-]?token|auth[_-]?token|private[_-]?key)[\w.-]*\s*[:=]\s*["'`](?P<secret>[^"'`\s]{16,})["'`]'''
entropy = 3.5
env = "APP_SECRET"
