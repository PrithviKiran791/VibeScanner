[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeguard"
version = "0.1.0"
description = "Hybrid static + LLM security scanner for vibe-coded web apps"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.70"]
gemini = ["google-genai>=1.0"]
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "fakeredis>=2.23",
    "ruff>=0.6",
]

[project.scripts]
vibeguard = "vibeguard.engine.cli:main"

[tool.setuptools.packages.find]
include = ["vibeguard*"]

[tool.setuptools.package-data]
"vibeguard.engine" = ["static/rules/*.toml", "llm/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # ruff format owns line length; long string literals are fine

[tool.ruff.lint.isort]
# backend/alembic/ (migrations) shadows the package name; it is third-party
known-third-party = ["alembic"]
